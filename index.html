<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Escolar — Alagoas · Municípios e Escolas</title>
  <meta name="description" content="Mapa escolar de Alagoas estilo Google Maps: 102 municípios, rede escolar, INEP, turnos e volumetria." />
  <meta property="og:title" content="Mapa Escolar — Municípios e Escolas" />
  <meta property="og:description" content="Navegue como no Google Maps: busque município ou escola por nome/INEP e veja a rede escolar." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a78bfa' stroke-width='2'%3E%3Cpath d='M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z'/%3E%3Ccircle cx='12' cy='9' r='2.5'/%3E%3C/svg%3E" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Dataset","name":"Mapa Escolar Municipios","description":"Municipios e escolas com INEP, turnos e volumetria","keywords":["mapa escolar","municipios","INEP","Leaflet"] }
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-page="mapa-escolar">
  <!-- Top search bar estilo Google Maps -->
  <!-- Pílula de menu superior-direita: home / pesquisa expansível / filtros (só ícones) -->
  <nav class="pill-menu glass" aria-label="Menu do mapa">
    <button id="btn-search" class="pill-btn" aria-label="Pesquisar escola" data-tip="Pesquisar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <input id="pill-search" class="pill-input" type="search" placeholder="Nome da escola cadastrada…" autocomplete="off" aria-label="Buscar escola" />
    <button id="search-clear" class="pill-btn" aria-label="Limpar busca" data-tip="Limpar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button id="btn-filter" class="pill-btn" aria-label="Filtros" data-tip="Filtros">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
    <span class="inline-filters" aria-label="Filtro por município">
      <span class="f-sep"></span>
      <span class="mun-combo">
        <button id="mun-btn" class="mun-btn" aria-haspopup="listbox" title="Filtrar por município">
          <span>Município: todos</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <span id="mun-drop" class="mun-drop glass hidden">
          <input id="mun-find" type="search" placeholder="Buscar município…" autocomplete="off" aria-label="Buscar município" />
          <span id="mun-list" class="mun-list" role="listbox"></span>
        </span>
      </span>
    </span>
    <button id="btn-layers" class="pill-btn" aria-label="Modo de visão" data-tip="Modo de visão">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
    </button>
    <span class="inline-layers" aria-label="Modo de visão">
      <span class="f-sep"></span>
      <button class="filter-chip mode active" data-mode="sat">Satélite</button>
      <button class="filter-chip mode" data-mode="esri">Esri</button>
      <button class="filter-chip mode" data-mode="osm">Ruas</button>
    </span>
    <a href="/escolas.html" class="pill-btn" aria-label="Registro de escolas" data-tip="Registro de escolas" style="text-decoration:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-4h6v4"/><path d="M9 11h.01M15 11h.01M12 11h.01"/></svg>
    </a>
    <a href="/logistica.html" class="pill-btn" aria-label="Painel logístico" data-tip="Painel logístico" style="text-decoration:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </a>
    <span class="apps-combo">
      <button id="btn-apps" class="pill-btn" aria-label="Mostrar opções" aria-haspopup="true" aria-expanded="false" data-tip="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="1.8"/><circle cx="12" cy="5" r="1.8"/><circle cx="19" cy="5" r="1.8"/><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/><circle cx="5" cy="19" r="1.8"/><circle cx="12" cy="19" r="1.8"/><circle cx="19" cy="19" r="1.8"/></svg>
      </button>
    </span>
  </nav>

  <div id="pill-count" class="pill-count glass hidden" aria-live="polite"></div>

  <button id="btn-home" class="pill-btn loc-fab" aria-label="Minha localização" data-tip="Minha localização">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>

  <div class="gmaps-layout fullmap">
    <main class="map-area">
      <div id="map" role="application" aria-label="Mapa escolar"></div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vivus/0.4.6/vivus.min.js"></script>
  <script>
    // Vivus SEMPRE que houver SVG (Skill 1.21)
    document.querySelectorAll('svg.draw').forEach((svg) => {
      try { new Vivus(svg, { type: 'delayed', duration: 120, start: 'autostart' }); } catch(e) {}
    });
    // reduced-motion
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('reduced');
    } else if (window.anime) {
      // entrada 60Hz da pílula (só transform/opacity)
      anime({ targets: '.pill-menu', translateY: [-18, 0], opacity: [0, 1], duration: 600, easing: 'cubicBezier(.22,1,.36,1)' });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
